[package]
name = "riffboard-game"
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "RiffBoard's browser game: WebGL2 note highway, audio clock, mic judging (wasm)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
riffboard-core = { path = "../core" }
serde_json = "1"
# Must match the wasm-bindgen CLI used by scripts/build-game.sh exactly.
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader",
    "WebGlBuffer", "WebGlVertexArrayObject", "WebGlUniformLocation", "WebGlTexture",
    "CanvasRenderingContext2d", "CanvasGradient", "Document", "Window", "Element", "TextMetrics",
] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
