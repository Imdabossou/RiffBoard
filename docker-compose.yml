# Example deployment. Put your feedpaks in ./library (subfolders are fine);
# new ones appear within five minutes, or straight away with
#   docker compose exec riffboard python tools/riffboard_admin.py rescan
services:
  riffboard:
    build: .
    image: riffboard:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ${LIBRARY_PATH:-./library}:/dlc:ro
      - riffboard-config:/config
    environment:
      # Behind a reverse proxy, name the header that carries the visitor's IP
      # so rate limits apply per visitor (e.g. CF-Connecting-IP for Cloudflare,
      # X-Forwarded-For for most others). Leave unset for a direct deployment.
      # - RIFFBOARD_CLIENT_IP_HEADER=CF-Connecting-IP
      # Where the "Source code" links point (AGPL: point it at YOUR fork if you
      # change the code).
      # - APP_SOURCE_URL=https://github.com/Imdabossou/RiffBoard
      - LOG_LEVEL=INFO
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  riffboard-config:
