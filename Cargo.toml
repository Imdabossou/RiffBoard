[package]
name = "riffboard"
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Public, play-only rhythm game server with per-song leaderboards (fork of fee[dB]ack)."
repository = "https://github.com/Imdabossou/RiffBoard"
publish = false

[workspace]
members = [".", "crates/core", "crates/game"]
# `cargo build` / `cargo test` at the root skip the wasm-only game crate;
# scripts/build-game.sh builds it.
default-members = [".", "crates/core"]

[dependencies]
riffboard-core = { path = "crates/core" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "signal", "sync"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = ["fs", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
yaml-rust2 = { version = "0.13", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
percent-encoding = "2"
getrandom = "0.4"
sha2 = "0.11"
subtle = "2"
unicode-normalization = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1

# The browser game: small and fast (scripts/build-game.sh).
[profile.wasm]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
