name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (unit + end-to-end against the reference responses)
        run: cargo test --workspace --locked
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-audit
      - name: Dependency advisories
        run: cargo audit --deny warnings

  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable && rustup default stable && rustup component add clippy && rustup target add wasm32-unknown-unknown
      - name: wasm-bindgen CLI (the version crates/game pins)
        run: cargo install wasm-bindgen-cli --locked --version "$(sed -n 's/^wasm-bindgen = "=\(.*\)"/\1/p' crates/game/Cargo.toml)"
      - name: Clippy (wasm)
        run: cargo clippy -p riffboard-game --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build the browser game
        run: bash scripts/build-game.sh

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Game client scripts parse
        run: for f in static/game/*.js; do node --check "$f"; done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t riffboard:ci .
      - name: Smoke test (read-only root, no capabilities)
        run: |
          docker run -d --name rb -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -v "$PWD/tests/fixtures/library:/dlc:ro" riffboard:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/version && break; sleep 1; done
          curl -fsS localhost:8000/ -o /dev/null
          test "$(curl -s localhost:8000/api/library | jq '.total')" = 3
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/settings)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/docs)" = 404
          curl -fsS -H 'Accept-Encoding: br' -D - -o /dev/null localhost:8000/static/game/pkg/riffboard_game_bg.wasm | grep -qi '^content-encoding: br'
          curl -fsS -D - -o /dev/null localhost:8000/ | grep -qi "^content-security-policy: .*wasm-unsafe-eval"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/plugins)" = 404
          docker exec rb /app/riffboard admin rescan
          docker exec rb /app/riffboard healthcheck
          docker logs rb
