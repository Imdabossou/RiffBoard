name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests (unit + end-to-end against the reference responses)
        run: cargo test --locked
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-audit
      - name: Dependency advisories
        run: cargo audit --deny warnings

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Frontend unit tests
        run: node --test tests/js/*.test.js 'tests/plugins/*/js/*.test.js'
      - name: Note-detection plugin tests
        run: node --test plugins/note_detect/test/*.test.js
      - name: 3D highway plugin tests
        run: node --test plugins/highway_3d/tests/*.test.js
      - name: Tailwind stylesheet is up to date
        run: |
          npx -y tailwindcss@3.4.19 -c tailwind.config.js -i static/_tailwind.src.css -o /tmp/tw.css --minify
          diff -q /tmp/tw.css static/tailwind.min.css || { echo "::error::static/tailwind.min.css is stale - run bash scripts/build-tailwind.sh"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t riffboard:ci .
      - name: Smoke test (read-only root, no capabilities)
        run: |
          docker run -d --name rb -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -v "$PWD/tests/fixtures/library:/dlc:ro" riffboard:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/version && break; sleep 1; done
          curl -fsS localhost:8000/ -o /dev/null
          test "$(curl -s localhost:8000/api/library | jq '.total')" = 3
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/settings)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/docs)" = 404
          curl -fsS -H 'Accept-Encoding: br' -D - -o /dev/null localhost:8000/static/app.js | grep -qi '^content-encoding: br'
          docker exec rb /app/riffboard admin rescan
          docker exec rb /app/riffboard healthcheck
          docker logs rb
