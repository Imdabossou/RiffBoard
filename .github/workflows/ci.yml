name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - name: Lint (pyflakes rules)
        run: ruff check --select F --exclude tests server.py main.py lib plugins tools
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Frontend unit tests
        run: node --test tests/js/*.test.js 'tests/plugins/*/js/*.test.js'
      - name: Note-detection plugin tests
        run: node --test plugins/note_detect/test/*.test.js
      - name: 3D highway plugin tests
        run: node --test plugins/highway_3d/tests/*.test.js
      - name: Tailwind stylesheet is up to date
        run: |
          npx -y tailwindcss@3.4.19 -c tailwind.config.js -i static/_tailwind.src.css -o /tmp/tw.css --minify
          diff -q /tmp/tw.css static/tailwind.min.css || { echo "::error::static/tailwind.min.css is stale - run bash scripts/build-tailwind.sh"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t riffboard:ci .
      - name: Smoke test (read-only root, no capabilities)
        run: |
          mkdir -p library && chmod a+rx library
          docker run -d --name rb -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -v "$PWD/library:/dlc:ro" riffboard:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/version && break; sleep 1; done
          curl -fsS localhost:8000/ -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/settings)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/docs)" = 404
          docker exec rb python tools/riffboard_admin.py rescan
          docker logs rb
