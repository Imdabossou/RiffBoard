<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>RiffBoard</title>
  <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/brand/icon-192.png">
  <link rel="stylesheet" href="/static/fonts/rubik.css">
  <link rel="stylesheet" href="/static/game/app.css">
  <link rel="stylesheet" href="/site.css">
  <link rel="modulepreload" href="/static/game/pkg/riffboard_game.js">
  <script src="/static/game/theme.js"></script>
  <script type="module" src="/static/game/app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/" id="brand"><span id="brand-name">RiffBoard</span></a>
    <nav>
      <a href="#/" data-nav="songs">Songs</a>
      <a href="#/boards" data-nav="boards">Leaderboards</a>
      <a href="#/settings" data-nav="settings">Settings</a>
      <button type="button" class="icon-btn" id="theme-btn" aria-label="Theme" title="Theme"></button>
    </nav>
  </header>
  <main id="view" tabindex="-1"></main>
  <footer class="foot wrap dim small" id="foot">RiffBoard</footer>

  <section id="play" hidden aria-label="Game">
    <canvas id="stage"></canvas>
    <div class="play-ui">
      <button type="button" class="icon-btn pause-btn" id="pause-btn" aria-label="Pause" title="Pause (Space)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
      </button>
    </div>
    <div class="overlay" id="play-overlay" hidden></div>
  </section>

  <noscript><p class="wrap">RiffBoard needs JavaScript.</p></noscript>
</body>
</html>
