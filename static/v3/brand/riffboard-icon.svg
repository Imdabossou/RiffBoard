<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RiffBoard">
  <defs>
    <linearGradient id="rb-pick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="rb-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- guitar pick -->
  <path d="M256 28C392 28 484 82 484 168C484 292 348 440 256 488C164 440 28 292 28 168C28 82 120 28 256 28Z" fill="url(#rb-pick)"/>
  <path d="M256 44C380 44 466 92 466 166C466 196 456 226 440 256C376 214 140 214 72 256C56 226 46 196 46 166C46 92 132 44 256 44Z" fill="url(#rb-shine)"/>
  <!-- podium = the leaderboard -->
  <g fill="#ffffff">
    <rect x="150" y="238" width="62" height="118" rx="12"/>
    <rect x="225" y="176" width="62" height="180" rx="12"/>
    <rect x="300" y="276" width="62" height="80" rx="12"/>
  </g>
  <!-- note-gem caps, in highway string colours -->
  <g stroke="#ffffff" stroke-width="6">
    <rect x="147" y="226" width="68" height="30" rx="9" fill="#f43f5e"/>
    <rect x="222" y="164" width="68" height="30" rx="9" fill="#22c55e"/>
    <rect x="297" y="264" width="68" height="30" rx="9" fill="#f59e0b"/>
  </g>
  <!-- star over first place -->
  <path transform="translate(0 -14)" d="M256 92l13.5 27.4 30.2 4.4-21.9 21.3 5.2 30.1L256 161l-27 14.2 5.2-30.1-21.9-21.3 30.2-4.4Z" fill="#fde047"/>
  <!-- base line (a string) -->
  <rect x="132" y="370" width="248" height="12" rx="6" fill="#ffffff" opacity="0.9"/>
</svg>
